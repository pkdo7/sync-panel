name: build-apk

on:
  workflow_dispatch:
    inputs:
      panel:
        description: "URL do painel (ex: https://painel.onrender.com)"
        required: true
      token:
        description: "BUILD_TOKEN do painel"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decodifica keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/ks"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/ks/release.jks"

      - name: Gera keystore se ausente
        run: |
          if [ ! -s "$HOME/ks/release.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/ks/release.jks" \
              -alias kl -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass klpass123 -keypass klpass123 \
              -dname "CN=Sync, OU=Sync, O=Sync, L=SP, S=SP, C=BR"
            echo "=== NOVO KEYSTORE (guarde em KEYSTORE_B64) ==="
            base64 "$HOME/ks/release.jks"
            echo "=============================================="
          fi

      - name: Permissão gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KS_FILE: /home/runner/ks/release.jks
          KS_PASS: klpass123
          KEY_ALIAS: kl
          KEY_PASS: klpass123
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PPANEL_URL="${{ inputs.panel }}" \
            -PBUILD_TOKEN="${{ inputs.token }}"

      - name: Upload artifact (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: sync-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Envia APK ao painel
        run: |
          APK=$(ls app/build/outputs/apk/release/*-release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then APK=$(ls app/build/outputs/apk/release/*.apk | head -1); fi
          echo "Enviando: $APK"
          curl -sSf -X POST \
            "${{ inputs.panel }}/api/upload?t=${{ inputs.token }}" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @"$APK"
